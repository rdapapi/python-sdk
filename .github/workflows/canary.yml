name: Canary

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Probe production
        env:
          RDAPAPI_API_KEY: ${{ secrets.RDAPAPI_API_KEY }}
        run: |
          if [ -z "$RDAPAPI_API_KEY" ]; then
            echo "::warning::RDAPAPI_API_KEY is not set — canary skipped"
            exit 0
          fi
          python canary.py
